<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PDFツールキット{% endblock %}</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect x=%224%22 y=%222%22 width=%2216%22 height=%2220%22 rx=%222%22 fill=%22%231F6F5C%22/><path d=%22M8 8h8M8 12h8M8 16h5%22 stroke=%22white%22 stroke-width=%221.5%22 stroke-linecap=%22round%22/></svg>">

    {% block head_extra %}{% endblock %}

<body class="{% block body_class %}{% endblock %}">

{% block scripts %}{% endblock %}
